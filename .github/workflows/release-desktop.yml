name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install desktop python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements-desktop.txt
          pip install pywebview pyinstaller

      - name: Build frontend desktop bundle
        run: |
          npm --prefix src/frontend install
          npm --prefix src/frontend run build:desktop

      - name: Package desktop app
        run: pyinstaller --noconfirm --clean desktop/music_guy.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicGuy-${{ runner.os }}
          path: dist/**
